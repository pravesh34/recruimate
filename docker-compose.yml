services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: sqlite:////data/recruimate.db
      UPLOAD_DIR: /data/uploads
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-heuristic}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-http://host.docker.internal:8080}
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      API_TOKEN: ${API_TOKEN:-}
    volumes:
      - recruimate_data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  recruimate_data:
