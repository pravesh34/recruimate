name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        env:
          AUTH_ENABLED: "false"
          SEED_DEMO_ACCOUNTS: "false"
          DEFAULT_PROVIDER: heuristic
          EMBEDDINGS_BACKEND: hashed
          OPENROUTER_API_KEY: ""
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
          API_TOKEN: ""
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q -p pytest_asyncio
      - name: Dependency vulnerability audit
        # Reports vulnerabilities in the job log; non-blocking until the
        # current findings are triaged (see security notes in ARCHITECTURE.md).
        run: |
          pip install pip-audit
          pip-audit --skip-editable --strict || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npx vite build
